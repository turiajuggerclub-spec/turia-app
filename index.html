<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turia Jugger">
  <meta name="application-name" content="Turia Jugger">
  <meta name="format-detection" content="telephone=no">
  <title>Turia Jugger</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <style>
    :root {
      --negro: #101010;
      --dorado: #CFA866;
      --blanco: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--negro);
      font-family: Arial, Helvetica, sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #F3F3F3;
      visibility: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: var(--negro);
      color: var(--blanco);
      text-align: center;
      padding: 24px;
    }

    .loaderCard {
      width: min(300px, 85vw);
    }

    .loaderCard img {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .loaderTitle {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .loaderSub {
      margin-top: 6px;
      color: var(--dorado);
      font-size: 13px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto 0;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--dorado);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #installCard {
      position: fixed;
      z-index: 40;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
      border-radius: 14px;
      background: rgba(16,16,16,.96);
      color: white;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    #installCard img {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
    }

    .installText {
      min-width: 0;
      flex: 1;
      font-size: 12px;
      line-height: 1.35;
    }

    .installText strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
    }

    .installButton {
      border: 0;
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--dorado);
      color: var(--negro);
      font-weight: 800;
      cursor: pointer;
    }

    .dismissButton {
      border: 0;
      background: transparent;
      color: #BBB;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 5px;
    }

    #errorCard {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 24px;
      background: var(--negro);
      color: white;
      text-align: center;
    }

    #errorCard > div {
      max-width: 380px;
    }

    #errorCard img {
      width: 100px;
      height: 100px;
      margin-bottom: 16px;
    }

    #openDirect {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 15px;
      border-radius: 9px;
      background: var(--dorado);
      color: var(--negro);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loaderCard">
      <img src="logo.svg" alt="Turia Jugger Club">
      <div class="loaderTitle">TURIA JUGGER CLUB</div>
      <div class="loaderSub">TEMPORADA 26/27</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    credentialless
    title="Turia Jugger Club"
    allow="geolocation 'none'; camera 'none'; microphone 'none'"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="installCard">
    <img src="icons/icon-192.png" alt="">
    <div class="installText">
      <strong>Instalar Turia Jugger</strong>
      <span id="installHelp">Añádela a tu pantalla de inicio.</span>
    </div>
    <button id="installButton" class="installButton" type="button">Instalar</button>
    <button id="dismissInstall" class="dismissButton" type="button" aria-label="Cerrar">×</button>
  </div>

  <div id="errorCard">
    <div>
      <img src="icons/icon-192.png" alt="">
      <h2>No se ha podido cargar la app</h2>
      <p>Comprueba que tienes conexión. Si el problema continúa, abre la aplicación directamente.</p>
      <a id="openDirect" href="#" target="_blank" rel="noopener">Abrir directamente</a>
    </div>
  </div>

  <script src="app-config.js"></script>
  <script>
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const errorCard = document.getElementById('errorCard');
    const openDirect = document.getElementById('openDirect');
    const installCard = document.getElementById('installCard');
    const installButton = document.getElementById('installButton');
    const installHelp = document.getElementById('installHelp');
    const dismissInstall = document.getElementById('dismissInstall');

    const appUrl = window.TURIA_APP_URL;
    let deferredPrompt = null;
    let appReady = false;
    let fallbackStage = 0;
    let fallbackTimer = null;

    const SESSION_TOKEN_KEY = 'turiaOuterToken';
    const SESSION_MEMBER_KEY = 'turiaOuterMiembro';

    function appUrlActualizada(extraParams) {
      if (!appUrl) return '';
      const u = new URL(appUrl);
      u.searchParams.set('turia_refresh', String(Date.now()));
      Object.entries(extraParams || {}).forEach(([k, v]) => u.searchParams.set(k, String(v)));
      return u.toString();
    }

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function restaurarSesionEnFrame() {
      const token = localStorage.getItem(SESSION_TOKEN_KEY) || '';
      const miembroID = localStorage.getItem(SESSION_MEMBER_KEY) || '';
      if (!token || !frame.contentWindow) return;
      frame.contentWindow.postMessage({
        type: 'TURIA_RESTORE_SESSION',
        token,
        miembroID
      }, '*');
    }

    function origenGoogleValido(origen) {
      try {
        const host = new URL(origen).hostname;
        return host === 'script.google.com' || host.endsWith('.googleusercontent.com');
      } catch (_) {
        return false;
      }
    }

    function mostrarAppLista() {
      appReady = true;
      clearTimeout(fallbackTimer);
      errorCard.style.display = 'none';
      frame.style.visibility = 'visible';
      loader.style.display = 'none';
      restaurarSesionEnFrame();
      setTimeout(restaurarSesionEnFrame, 800);
    }

    function cargarModo(stage) {
      appReady = false;
      fallbackStage = stage;
      errorCard.style.display = 'none';
      loader.style.display = 'grid';
      frame.style.visibility = 'hidden';

      // 0: sin credenciales/cookies de Google.
      // 1: iframe normal indicando authuser=0 para desambiguar multi-cuenta.
      // 2: iframe normal sin parámetros de cuenta.
      if (stage === 0) {
        frame.setAttribute('credentialless', '');
        frame.src = appUrlActualizada();
      } else if (stage === 1) {
        frame.removeAttribute('credentialless');
        frame.src = appUrlActualizada({authuser: 0});
      } else {
        frame.removeAttribute('credentialless');
        frame.src = appUrlActualizada();
      }

      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => {
        if (appReady) return;
        if (stage < 2) {
          cargarModo(stage + 1);
        } else {
          loader.style.display = 'none';
          frame.style.visibility = 'hidden';
          errorCard.style.display = 'grid';
        }
      }, stage === 0 ? 4500 : 6000);
    }

    // El evento load también se dispara cuando Google muestra su página de
    // error. Por eso NO lo usamos para decidir que la app está lista.
    frame.addEventListener('load', () => {
      restaurarSesionEnFrame();
    });

    window.addEventListener('message', event => {
      const mensaje = event.data || {};
      if (!origenGoogleValido(event.origin)) return;

      if (mensaje.type === 'TURIA_APP_READY') {
        mostrarAppLista();
        return;
      }

      if (mensaje.type === 'TURIA_STORE_SESSION' && mensaje.token) {
        localStorage.setItem(SESSION_TOKEN_KEY, String(mensaje.token));
        localStorage.setItem(SESSION_MEMBER_KEY, String(mensaje.miembroID || ''));
      }

      if (mensaje.type === 'TURIA_CLEAR_SESSION') {
        localStorage.removeItem(SESSION_TOKEN_KEY);
        localStorage.removeItem(SESSION_MEMBER_KEY);
      }
    });

    if (!appUrl || !/^https:\/\//i.test(appUrl)) {
      errorCard.style.display = 'grid';
      loader.style.display = 'none';
    } else {
      openDirect.href = appUrl;
      cargarModo(0);
    }

    window.addEventListener('online', () => {
      if (!appReady && appUrl) cargarModo(0);
    });

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      if (!isStandalone() && localStorage.getItem('turiaInstallDismissed') !== '1') {
        installHelp.textContent = 'Instálala como una app en tu móvil.';
        installButton.style.display = 'inline-block';
        installCard.style.display = 'flex';
      }
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installCard.style.display = 'none';
    });

    dismissInstall.addEventListener('click', () => {
      localStorage.setItem('turiaInstallDismissed', '1');
      installCard.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installCard.style.display = 'none';
    });

    // En iPhone/iPad no existe beforeinstallprompt. Mostramos una ayuda breve.
    if (isIOS() && !isStandalone() && localStorage.getItem('turiaInstallDismissed') !== '1') {
      installHelp.textContent = 'Safari: Compartir → Añadir a pantalla de inicio.';
      installButton.style.display = 'none';
      installCard.style.display = 'flex';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

 <script type="module">
  import {
    initializeApp,
    getApps,
    getApp
  } from
    'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';

  import {
    getMessaging,
    getToken,
    deleteToken,
    isSupported,
    onMessage
  } from
    'https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js';

  const FIREBASE_CONFIG = {
    apiKey:
      "AIzaSyAsU2pCBgfyM_W7zVQPYkWixp40k_E5u6w",

    authDomain:
      "turia-3519f.firebaseapp.com",

    projectId:
      "turia-3519f",

    storageBucket:
      "turia-3519f.firebasestorage.app",

    messagingSenderId:
      "257867676656",

    appId:
      "1:257867676656:web:682be9768e12b5bbbdfb35"
  };

  const VAPID_KEY =
    "BOlZ_aJbMA_oUQ7R4wG5XrpKwQVJ0h2n2cIiEcvesbQx56AYRlmEPEuuD18Ol1teMbbpVL9p1BtfFkpmT24BJM";

  let appFirebase = null;
  let messagingFirebase = null;
  let serviceWorkerRegistration = null;
  let firebasePreparado = false;

  let ultimoToken =
    localStorage.getItem(
      'turiaNotificationFid'
    ) || '';

  function enviarAlFrame(payload) {
    const frame =
      document.getElementById('appFrame');

    if (
      frame &&
      frame.contentWindow
    ) {
      frame.contentWindow.postMessage(
        payload,
        '*'
      );
    }
  }

  async function prepararFirebase() {
    if (firebasePreparado) {
      return messagingFirebase;
    }

    if (
      !('serviceWorker' in navigator)
    ) {
      throw new Error(
        'Este navegador no admite Service Workers.'
      );
    }

    if (
      !('Notification' in window)
    ) {
      throw new Error(
        'Este navegador no admite notificaciones.'
      );
    }

    const compatible =
      await isSupported();

    if (!compatible) {
      throw new Error(
        'Firebase Cloud Messaging no está disponible en este navegador.'
      );
    }

    serviceWorkerRegistration =
      await navigator.serviceWorker.ready;

    if (getApps().length) {
      appFirebase = getApp();
    } else {
      appFirebase =
        initializeApp(FIREBASE_CONFIG);
    }

    messagingFirebase =
      getMessaging(appFirebase);

    onMessage(
      messagingFirebase,
      payload => {
        const notification =
          payload.notification || {};

        const title =
          notification.title ||
          'Turia Jugger Club';

        const body =
          notification.body || '';

        if (
          Notification.permission ===
          'granted'
        ) {
          new Notification(
            title,
            {
              body,
              icon:
                './icons/icon-192.png'
            }
          );
        }
      }
    );

    firebasePreparado = true;

    return messagingFirebase;
  }

  window.addEventListener(
    'message',
    async event => {
      const mensaje =
        event.data || {};

      const tiposAdmitidos = [
        'TURIA_NOTIFICATION_STATUS',
        'TURIA_ENABLE_NOTIFICATIONS',
        'TURIA_DISABLE_NOTIFICATIONS'
      ];

      if (
        !tiposAdmitidos.includes(
          mensaje.type
        )
      ) {
        return;
      }

      try {
        if (
          mensaje.type ===
          'TURIA_NOTIFICATION_STATUS'
        ) {
          let supported = false;

          try {
            supported =
              await isSupported();
          } catch (error) {
            supported = false;
          }

          enviarAlFrame({
            type:
              'TURIA_NOTIFICATION_STATUS_RESULT',

            supported,

            permission:
              'Notification' in window
                ? Notification.permission
                : 'unsupported',

            fid: ultimoToken
          });

          return;
        }

        if (
          mensaje.type ===
          'TURIA_ENABLE_NOTIFICATIONS'
        ) {
          const permiso =
            await Notification.requestPermission();

          if (permiso !== 'granted') {
            throw new Error(
              permiso === 'denied'
                ? 'Has bloqueado las notificaciones en el navegador.'
                : 'No se concedió permiso para notificaciones.'
            );
          }

          const messaging =
            await prepararFirebase();

          const token =
            await getToken(
              messaging,
              {
                vapidKey: VAPID_KEY,
                serviceWorkerRegistration
              }
            );

          if (!token) {
            throw new Error(
              'Firebase no devolvió ningún token.'
            );
          }

          ultimoToken = token;

          localStorage.setItem(
            'turiaNotificationFid',
            token
          );

          enviarAlFrame({
            type:
              'TURIA_NOTIFICATION_FID',
            fid: token,
            permission: permiso
          });

          return;
        }

        if (
          mensaje.type ===
          'TURIA_DISABLE_NOTIFICATIONS'
        ) {
          const messaging =
            await prepararFirebase();

          await deleteToken(messaging);

          const tokenAnterior =
            ultimoToken;

          ultimoToken = '';

          localStorage.removeItem(
            'turiaNotificationFid'
          );

          enviarAlFrame({
            type:
              'TURIA_NOTIFICATION_DISABLED',
            fid: tokenAnterior
          });
        }

      } catch (error) {
        enviarAlFrame({
          type:
            'TURIA_NOTIFICATION_ERROR',

          message:
            error &&
            error.message
              ? error.message
              : String(error)
        });
      }
    }
  );
</script>
</body>
</html>
