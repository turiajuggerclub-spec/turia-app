<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turia Jugger">
  <meta name="application-name" content="Turia Jugger">
  <meta name="format-detection" content="telephone=no">
  <title>Turia Jugger</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <style>
    :root {
      --negro: #101010;
      --dorado: #CFA866;
      --blanco: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--negro);
      font-family: Arial, Helvetica, sans-serif;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #F3F3F3;
      visibility: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: var(--negro);
      color: var(--blanco);
      text-align: center;
      padding: 24px;
    }

    .loaderCard {
      width: min(300px, 85vw);
    }

    .loaderCard img {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .loaderTitle {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .loaderSub {
      margin-top: 6px;
      color: var(--dorado);
      font-size: 13px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto 0;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--dorado);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #installCard {
      position: fixed;
      z-index: 40;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px;
      border-radius: 14px;
      background: rgba(16,16,16,.96);
      color: white;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    #installCard img {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
    }

    .installText {
      min-width: 0;
      flex: 1;
      font-size: 12px;
      line-height: 1.35;
    }

    .installText strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
    }

    .installButton {
      border: 0;
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--dorado);
      color: var(--negro);
      font-weight: 800;
      cursor: pointer;
    }

    .dismissButton {
      border: 0;
      background: transparent;
      color: #BBB;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 5px;
    }

    #errorCard {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 24px;
      background: var(--negro);
      color: white;
      text-align: center;
    }

    #errorCard > div {
      max-width: 380px;
    }

    #errorCard img {
      width: 100px;
      height: 100px;
      margin-bottom: 16px;
    }

    #openDirect {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 15px;
      border-radius: 9px;
      background: var(--dorado);
      color: var(--negro);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loaderCard">
      <img src="logo.svg" alt="Turia Jugger Club">
      <div class="loaderTitle">TURIA JUGGER CLUB</div>
      <div class="loaderSub">TEMPORADA 26/27</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    credentialless
    title="Turia Jugger Club"
    allow="geolocation 'none'; camera 'none'; microphone 'none'"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="installCard">
    <img src="icons/icon-192.png" alt="">
    <div class="installText">
      <strong>Instalar Turia Jugger</strong>
      <span id="installHelp">Añádela a tu pantalla de inicio.</span>
    </div>
    <button id="installButton" class="installButton" type="button">Instalar</button>
    <button id="dismissInstall" class="dismissButton" type="button" aria-label="Cerrar">×</button>
  </div>

  <div id="errorCard">
    <div>
      <img src="icons/icon-192.png" alt="">
      <h2>No se ha podido cargar la app</h2>
      <p>Comprueba que tienes conexión. Si el problema continúa, abre la aplicación directamente.</p>
      <a id="openDirect" href="#" target="_blank" rel="noopener">Abrir directamente</a>
    </div>
  </div>

  <script src="app-config.js"></script>
  <script>
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const errorCard = document.getElementById('errorCard');
    const openDirect = document.getElementById('openDirect');
    const installCard = document.getElementById('installCard');
    const installButton = document.getElementById('installButton');
    const installHelp = document.getElementById('installHelp');
    const dismissInstall = document.getElementById('dismissInstall');

    const appUrl = window.TURIA_APP_URL;
    let deferredPrompt = null;
    let appReady = false;
    let fallbackStage = 0;
    let fallbackTimer = null;

    const SESSION_TOKEN_KEY = 'turiaOuterToken';
    const SESSION_MEMBER_KEY = 'turiaOuterMiembro';

    function appUrlActualizada(extraParams) {
      if (!appUrl) return '';
      const u = new URL(appUrl);
      u.searchParams.set('turia_refresh', String(Date.now()));
      Object.entries(extraParams || {}).forEach(([k, v]) => u.searchParams.set(k, String(v)));
      return u.toString();
    }

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function restaurarSesionEnFrame() {
      const token = localStorage.getItem(SESSION_TOKEN_KEY) || '';
      const miembroID = localStorage.getItem(SESSION_MEMBER_KEY) || '';
      if (!token || !frame.contentWindow) return;
      frame.contentWindow.postMessage({
        type: 'TURIA_RESTORE_SESSION',
        token,
        miembroID
      }, '*');
    }

    function origenGoogleValido(origen) {
      try {
        const host = new URL(origen).hostname;
        return host === 'script.google.com' || host.endsWith('.googleusercontent.com');
      } catch (_) {
        return false;
      }
    }

    function mostrarAppLista() {
      appReady = true;
      clearTimeout(fallbackTimer);
      errorCard.style.display = 'none';
      frame.style.visibility = 'visible';
      loader.style.display = 'none';
      restaurarSesionEnFrame();
      setTimeout(restaurarSesionEnFrame, 800);
    }

    function cargarModo(stage) {
      appReady = false;
      fallbackStage = stage;
      errorCard.style.display = 'none';
      loader.style.display = 'grid';
      frame.style.visibility = 'hidden';

      // 0: sin credenciales/cookies de Google.
      // 1: iframe normal indicando authuser=0 para desambiguar multi-cuenta.
      // 2: iframe normal sin parámetros de cuenta.
      if (stage === 0) {
        frame.setAttribute('credentialless', '');
        frame.src = appUrlActualizada();
      } else if (stage === 1) {
        frame.removeAttribute('credentialless');
        frame.src = appUrlActualizada({authuser: 0});
      } else {
        frame.removeAttribute('credentialless');
        frame.src = appUrlActualizada();
      }

      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => {
        if (appReady) return;
        if (stage < 2) {
          cargarModo(stage + 1);
        } else {
          loader.style.display = 'none';
          frame.style.visibility = 'hidden';
          errorCard.style.display = 'grid';
        }
      }, stage === 0 ? 4500 : 6000);
    }

    // El evento load también se dispara cuando Google muestra su página de
    // error. Por eso NO lo usamos para decidir que la app está lista.
    frame.addEventListener('load', () => {
      restaurarSesionEnFrame();
    });

    window.addEventListener('message', event => {
      const mensaje = event.data || {};
      if (!origenGoogleValido(event.origin)) return;

      if (mensaje.type === 'TURIA_APP_READY') {
        mostrarAppLista();
        return;
      }

      if (mensaje.type === 'TURIA_STORE_SESSION' && mensaje.token) {
        localStorage.setItem(SESSION_TOKEN_KEY, String(mensaje.token));
        localStorage.setItem(SESSION_MEMBER_KEY, String(mensaje.miembroID || ''));
      }

      if (mensaje.type === 'TURIA_CLEAR_SESSION') {
        localStorage.removeItem(SESSION_TOKEN_KEY);
        localStorage.removeItem(SESSION_MEMBER_KEY);
      }
    });

    if (!appUrl || !/^https:\/\//i.test(appUrl)) {
      errorCard.style.display = 'grid';
      loader.style.display = 'none';
    } else {
      openDirect.href = appUrl;
      cargarModo(0);
    }

    window.addEventListener('online', () => {
      if (!appReady && appUrl) cargarModo(0);
    });

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      if (!isStandalone() && localStorage.getItem('turiaInstallDismissed') !== '1') {
        installHelp.textContent = 'Instálala como una app en tu móvil.';
        installButton.style.display = 'inline-block';
        installCard.style.display = 'flex';
      }
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installCard.style.display = 'none';
    });

    dismissInstall.addEventListener('click', () => {
      localStorage.setItem('turiaInstallDismissed', '1');
      installCard.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installCard.style.display = 'none';
    });

    // En iPhone/iPad no existe beforeinstallprompt. Mostramos una ayuda breve.
    if (isIOS() && !isStandalone() && localStorage.getItem('turiaInstallDismissed') !== '1') {
      installHelp.textContent = 'Safari: Compartir → Añadir a pantalla de inicio.';
      installButton.style.display = 'none';
      installCard.style.display = 'flex';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getMessaging, isSupported, onRegistered, onUnregistered, register, unregister, onMessage } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js';

    const cfg = globalThis.TURIA_FIREBASE_CONFIG || {};
    const vapidKey = globalThis.TURIA_FIREBASE_VAPID_KEY || '';
    let messaging = null;
    let swReg = null;
    let ultimoFid = localStorage.getItem('turiaNotificationFid') || '';
    let firebaseListo = false;

    function enviarAlFrame(payload){
      const f=document.getElementById('appFrame');
      if(f&&f.contentWindow)f.contentWindow.postMessage(payload,'*');
    }
    function configCompleta(){return !!(cfg.apiKey&&cfg.projectId&&cfg.messagingSenderId&&cfg.appId&&vapidKey);}
    async function prepararFirebase(){
      if(firebaseListo)return true;
      if(!configCompleta())throw new Error('Falta completar firebase-config.js en GitHub.');
      if(!(await isSupported()))throw new Error('Este navegador no admite Firebase Cloud Messaging.');
      swReg=await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      const app=initializeApp(cfg);
      messaging=getMessaging(app);
      onRegistered(messaging,(fid)=>{
        ultimoFid=String(fid||'');
        if(ultimoFid)localStorage.setItem('turiaNotificationFid',ultimoFid);
        enviarAlFrame({type:'TURIA_NOTIFICATION_FID',fid:ultimoFid,permission:Notification.permission});
      });
      onUnregistered(messaging,(fid)=>{
        const viejo=String(fid||ultimoFid||'');
        localStorage.removeItem('turiaNotificationFid');ultimoFid='';
        enviarAlFrame({type:'TURIA_NOTIFICATION_DISABLED',fid:viejo});
      });
      onMessage(messaging,(payload)=>{
        const n=(payload&&payload.notification)||{};
        if(n.title&&Notification.permission==='granted'){
          new Notification(n.title,{body:n.body||'',icon:'./icons/icon-192.png'});
        }
      });
      firebaseListo=true;
      return true;
    }

    window.addEventListener('message',async(event)=>{
      const m=event.data||{};
      if(!['TURIA_NOTIFICATION_STATUS','TURIA_ENABLE_NOTIFICATIONS','TURIA_DISABLE_NOTIFICATIONS'].includes(m.type))return;
      try{
        if(m.type==='TURIA_NOTIFICATION_STATUS'){
          let supported=false;
          try{supported=await isSupported();}catch(_){supported=false;}
          enviarAlFrame({type:'TURIA_NOTIFICATION_STATUS_RESULT',supported,permission:('Notification'in window?Notification.permission:'unsupported'),fid:ultimoFid});
          return;
        }
        if(m.type==='TURIA_ENABLE_NOTIFICATIONS'){
          if(!('Notification'in window))throw new Error('Este navegador no admite notificaciones.');
          const permiso=await Notification.requestPermission();
          if(permiso!=='granted')throw new Error(permiso==='denied'?'Has bloqueado las notificaciones en el navegador.':'No se concedió permiso para notificaciones.');
          await prepararFirebase();
          await register(messaging,{vapidKey,serviceWorkerRegistration:swReg});
          return;
        }
        if(m.type==='TURIA_DISABLE_NOTIFICATIONS'){
          const viejo=ultimoFid;
          await prepararFirebase();
          await unregister(messaging);
          // Si el SDK no dispara onUnregistered por alguna razón, mantenemos el backend sincronizado.
          setTimeout(()=>{if(viejo&&ultimoFid===viejo){localStorage.removeItem('turiaNotificationFid');ultimoFid='';enviarAlFrame({type:'TURIA_NOTIFICATION_DISABLED',fid:viejo});}},400);
        }
      }catch(e){enviarAlFrame({type:'TURIA_NOTIFICATION_ERROR',message:e&&e.message?e.message:String(e)});}
    });
  </script>
</body>
</html>
